[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
borsh = "1.6.1"
litesvm = "0.11.0"
petgraph = "0.8.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
solana-account = "3.2.0"
solana-address = "2.0"
solana-client = "3.1.12"
solana-instruction = { version = "3.0.0", features = ["std"] }
solana-keypair = "3.1"
solana-message = "3.0.1"
solana-program-option = "3.0.0"
solana-program-pack = "3.0"
solana-signer = "3.0"
solana-sdk = "4.0.1"
solana-transaction = { version = "3.0", features = ["verify"] }
spl-token-interface = "2.0.0"
tokio = { version = "1.52.1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
